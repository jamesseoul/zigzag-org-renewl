<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링크 버튼 프로토타입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="container max-w-2xl mx-auto px-6">
        <div class="bg-white rounded-2xl shadow-2xl p-12">
            <h1 class="text-4xl font-bold text-gray-800 text-center mb-4">
                링크 선택
            </h1>
            <p class="text-gray-600 text-center mb-12">
                원하는 사이트를 선택해주세요
            </p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Naver Button -->
                <a href="https://naver.com" target="_blank"
                   class="block bg-green-500 hover:bg-green-600 text-white font-bold py-20 px-8 rounded-2xl transition-all duration-300 transform hover:scale-105 hover:shadow-2xl text-center border-4 border-green-600">
                    <div class="text-6xl mb-4">N</div>
                    <div class="text-2xl">네이버</div>
                </a>

                <!-- Google Button -->
                <a href="https://google.com" target="_blank"
                   class="block bg-blue-500 hover:bg-blue-600 text-white font-bold py-20 px-8 rounded-2xl transition-all duration-300 transform hover:scale-105 hover:shadow-2xl text-center border-4 border-blue-600">
                    <div class="text-6xl mb-4">G</div>
                    <div class="text-2xl">구글</div>
                </a>

                <!-- ChatGPT Button -->
                <a href="https://chat.openai.com" target="_blank"
                   class="block bg-purple-500 hover:bg-purple-600 text-white font-bold py-20 px-8 rounded-2xl transition-all duration-300 transform hover:scale-105 hover:shadow-2xl text-center border-4 border-purple-600">
                    <div class="text-6xl mb-4">C</div>
                    <div class="text-2xl">ChatGPT</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
