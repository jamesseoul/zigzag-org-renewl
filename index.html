<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링크 버튼 프로토타입</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #c7d2fe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 60px 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1f2937;
            text-align: center;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: 1.125rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 60px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 768px) {
            .button-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .button-box {
            display: block;
            text-decoration: none;
            text-align: center;
            padding: 80px 32px;
            border-radius: 16px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            border: 4px solid;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .button-box:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.3);
        }

        .button-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .button-text {
            font-size: 1.5rem;
        }

        .naver-button {
            background-color: #22c55e;
            border-color: #16a34a;
        }

        .naver-button:hover {
            background-color: #16a34a;
        }

        .google-button {
            background-color: #3b82f6;
            border-color: #2563eb;
        }

        .google-button:hover {
            background-color: #2563eb;
        }

        .chatgpt-button {
            background-color: #a855f7;
            border-color: #9333ea;
        }

        .chatgpt-button:hover {
            background-color: #9333ea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>링크 선택</h1>
            <p class="subtitle">원하는 사이트를 선택해주세요</p>

            <div class="button-grid">
                <!-- Naver Button -->
                <a href="https://naver.com" target="_blank" class="button-box naver-button">
                    <div class="button-icon">N</div>
                    <div class="button-text">네이버</div>
                </a>

                <!-- Google Button -->
                <a href="https://google.com" target="_blank" class="button-box google-button">
                    <div class="button-icon">G</div>
                    <div class="button-text">구글</div>
                </a>

                <!-- ChatGPT Button -->
                <a href="https://chat.openai.com" target="_blank" class="button-box chatgpt-button">
                    <div class="button-icon">C</div>
                    <div class="button-text">ChatGPT</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
