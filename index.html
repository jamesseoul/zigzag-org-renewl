<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 정보 추출기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .input-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            color: #374151;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .result-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .result-card.show {
            display: block;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-image {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4rem;
        }

        .product-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 16px;
        }

        .product-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 16px;
            background: #f3f4f6;
            border-radius: 8px;
        }

        .info-label {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1f2937;
        }

        .product-description {
            padding: 20px;
            background: #fef3c7;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
            margin-bottom: 20px;
        }

        .product-url {
            padding: 12px;
            background: #f3f4f6;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #6b7280;
            word-break: break-all;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
        }

        .reset-btn:hover {
            background: #4b5563;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 상품 정보 추출기</h1>
            <p>상품 URL을 입력하면 자동으로 정보를 가져옵니다</p>
        </div>

        <div class="input-card">
            <form id="productForm">
                <div class="input-group">
                    <label for="productUrl">상품 URL</label>
                    <input
                        type="url"
                        id="productUrl"
                        placeholder="https://example.com/product/12345"
                        required
                    >
                </div>
                <button type="submit" class="submit-btn">정보 가져오기</button>
            </form>
        </div>

        <div class="result-card" id="resultCard">
            <div class="product-image" id="productImage">📦</div>

            <h2 class="product-title" id="productTitle">상품명</h2>

            <div class="product-info">
                <div class="info-item">
                    <div class="info-label">가격</div>
                    <div class="info-value" id="productPrice">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">판매처</div>
                    <div class="info-value" id="productSeller">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">카테고리</div>
                    <div class="info-value" id="productCategory">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">평점</div>
                    <div class="info-value" id="productRating">-</div>
                </div>
            </div>

            <div class="product-description">
                <div class="info-label">상품 설명</div>
                <p id="productDescription">상품에 대한 설명이 여기에 표시됩니다.</p>
            </div>

            <div class="info-label" style="margin-bottom: 8px;">원본 URL</div>
            <div class="product-url" id="productUrlDisplay"></div>

            <button class="reset-btn" onclick="resetForm()">다시 검색하기</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('productForm');
        const resultCard = document.getElementById('resultCard');
        const submitBtn = form.querySelector('.submit-btn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const url = document.getElementById('productUrl').value;

            // 로딩 상태 표시
            submitBtn.textContent = '정보 가져오는 중...';
            submitBtn.disabled = true;

            try {
                // 백엔드 API 호출
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '서버 오류가 발생했습니다');
                }

                const data = await response.json();

                // 결과 표시
                displayResult(data);

            } catch (error) {
                alert('오류: ' + error.message);
                console.error('Error:', error);
            } finally {
                // 버튼 상태 복구
                submitBtn.textContent = '정보 가져오기';
                submitBtn.disabled = false;
            }
        });

        function displayResult(data) {
            document.getElementById('productTitle').textContent = data.title;
            document.getElementById('productPrice').textContent = data.price;
            document.getElementById('productSeller').textContent = data.seller;
            document.getElementById('productCategory').textContent = data.category;
            document.getElementById('productRating').textContent = data.rating;
            document.getElementById('productDescription').textContent = data.description;
            document.getElementById('productUrlDisplay').textContent = data.url;

            // 이미지가 있으면 표시
            const productImage = document.getElementById('productImage');
            if (data.image) {
                productImage.innerHTML = `<img src="${data.image}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px;" alt="상품 이미지">`;
            } else {
                productImage.innerHTML = '📦';
            }

            resultCard.classList.add('show');
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            resultCard.classList.remove('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
